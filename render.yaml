services:
  - type: web
    name: fantasy-bot
    runtime: python
    plan: free
    numInstances: 1
    buildCommand: |
      pip install -r requirements.txt
      apt-get update && apt-get install -y chromium
    startCommand: python tg.py
    envVars:
      - key: HTML2IMAGE_CHROME_BIN
        value: /usr/bin/chromium
